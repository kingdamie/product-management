{% extends "products/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="form-card">
  <h1>{{ title }}</h1>

  {# enctype is required, otherwise the image file is not uploaded #}
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
      <button class="btn" type="submit">Save</button>
      <a class="btn btn-ghost" href="{% url 'products:list' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
