{% extends "products/base.html" %}

{% block title %}Delete {{ product.name }}{% endblock %}

{% block content %}
<div class="form-card">
  <h1>Delete "{{ product.name }}"?</h1>
  <p class="description">This cannot be undone.</p>

  <form method="post">
    {% csrf_token %}
    <div class="actions">
      <button class="btn btn-danger" type="submit">Yes, delete</button>
      <a class="btn btn-ghost" href="{% url 'products:detail' product.id %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
